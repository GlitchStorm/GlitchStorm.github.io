name: Deploy Mechatronics Academy Worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "academy/server/**"
      - ".github/workflows/deploy-academy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Cloudflare configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN GitHub secret" && exit 1)
          test -n "$CF_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret" && exit 1)
          if grep -q REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID academy/server/wrangler.toml; then echo "Configure D1 database_id first"; exit 1; fi
      - name: Deploy Academy MCP Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: academy/server
          command: deploy

# One-time setup remains manual:
# 1) npx wrangler d1 create academy-db
# 2) update wrangler.toml database_id and apply remote migrations
# 3) npx wrangler secret put ACADEMY_TOKEN
# 4) Configure the GitHub CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets
