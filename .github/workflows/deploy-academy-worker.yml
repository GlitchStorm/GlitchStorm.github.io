name: Deploy Mechatronics Academy Worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "academy/server/**"
      - ".github/workflows/deploy-academy-worker.yml"

concurrency:
  group: academy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: academy/server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials and D1 config
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if grep -q REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID wrangler.toml; then
            echo "::error::Set the D1 database_id in wrangler.toml"
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Apply pending remote D1 migrations
        run: npx wrangler d1 migrations apply academy-db --remote

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy

      - name: Confirm Wrangler deployment completed
        run: echo "Academy D1 migrations and Worker deploy completed successfully"
